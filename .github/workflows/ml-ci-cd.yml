name: Student Placement ML CI-CD

on:
  push:
    branches: ["main"]

jobs:

  test:
    name: CI - Train and Test Model
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Model
        run: |
          python train.py

      - name: Check Model File
        run: |
          test -f student_placement_model.pkl

      - name: Run Automated Tests
        run: |
          pytest

  deploy:
    name: CD - Deploy Application
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Student Placement Model deployed successfully!"